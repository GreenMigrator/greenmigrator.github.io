<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to Ramadan 2025</title>
    <style>
        body {
            font-family: "Comic Sans MS", cursive, sans-serif;
            text-align: center;
            background-color: #a7c7a0;
            padding: 50px;
        }
        h1 {
            color: #2e604a;
        }
        #countdown {
            font-size: 2em;
            margin-top: 20px;
            color: #4a7c59;
        }
    </style>
</head>
<body>
    <h1>Countdown to Ramadan 2025</h1>
    <div id="countdown"></div>

    <script>
        function updateCountdown() {
            const ramadanDate = new Date("February 28, 2025 00:00:00").getTime();
            const now = new Date().getTime();
            const timeLeft = ramadanDate - now;

            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;

            if (timeLeft < 0) {
                document.getElementById("countdown").innerHTML = "Ramadan has begun!";
            }
        }
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
